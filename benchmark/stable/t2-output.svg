<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif">
  <defs>
    <!-- 深空径向渐变 -->
    <radialGradient id="spaceGrad" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#1a2340"/>
      <stop offset="55%" stop-color="#0b1026"/>
      <stop offset="100%" stop-color="#030510"/>
    </radialGradient>
    <!-- 爆炸核心光晕 -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff7e6"/>
      <stop offset="25%" stop-color="#ffd94d"/>
      <stop offset="55%" stop-color="#ff8c3a"/>
      <stop offset="100%" stop-color="#ff8c3a" stop-opacity="0"/>
    </radialGradient>
    <!-- 外层扩散光晕 -->
    <radialGradient id="outerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff9e4a" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#ff6b2a" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ff6b2a" stop-opacity="0"/>
    </radialGradient>
    <!-- 星系/物质团块渐变 -->
    <radialGradient id="matterGrad" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#fff3d6"/>
      <stop offset="100%" stop-color="#e8a24b"/>
    </radialGradient>
    <!-- 卡片背景 -->
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#16234a" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0c1430" stop-opacity="0.75"/>
    </linearGradient>
  </defs>

  <!-- 背景深空 -->
  <rect width="1200" height="900" fill="url(#spaceGrad)"/>

  <!-- 散布的星星 -->
  <g fill="#ffffff">
    <circle cx="80" cy="70" r="1.6"/><circle cx="230" cy="45" r="1.1"/>
    <circle cx="410" cy="90" r="1.8"/><circle cx="620" cy="55" r="1.2"/>
    <circle cx="820" cy="75" r="1.5"/><circle cx="1010" cy="50" r="1.9"/>
    <circle cx="1130" cy="110" r="1.1"/><circle cx="60" cy="240" r="1.3"/>
    <circle cx="1150" cy="260" r="1.6"/><circle cx="90" cy="700" r="1.4"/>
    <circle cx="1140" cy="680" r="1.2"/><circle cx="300" cy="850" r="1.5"/>
    <circle cx="950" cy="840" r="1.3"/><circle cx="560" cy="870" r="1.7"/>
    <circle cx="720" cy="80" r="1.0"/><circle cx="470" cy="30" r="1.0"/>
  </g>

  <!-- 标题 -->
  <text x="600" y="58" text-anchor="middle" font-size="42" font-weight="900" fill="#ffffff" letter-spacing="4">宇宙大爆炸理论</text>
  <text x="600" y="92" text-anchor="middle" font-size="17" fill="#a8b8e0" letter-spacing="2">The Big Bang Theory · 从一点到浩瀚宇宙的起源</text>

  <!-- ===================== 左侧：爆炸核心与扩散 ===================== -->
  <g transform="translate(300,460)">
    <!-- 外层扩散光晕 -->
    <circle r="190" fill="url(#outerGlow)"/>
    <!-- 核心光晕 -->
    <circle r="120" fill="url(#coreGlow)"/>
    <!-- 爆炸中心点 -->
    <circle r="14" fill="#fff7e6"/>
    <circle r="8" fill="#ffffff"/>

    <!-- 扩散的冲击波圆环 -->
    <g stroke="#ff9e4a" fill="none">
      <circle r="55" stroke-opacity="0.7" stroke-width="2.5"/>
      <circle r="95" stroke-opacity="0.45" stroke-width="2"/>
      <circle r="135" stroke-opacity="0.28" stroke-width="1.8"/>
      <circle r="175" stroke-opacity="0.16" stroke-width="1.5"/>
    </g>

    <!-- 向外飞散的物质/星系团块 -->
    <g fill="url(#matterGrad)">
      <ellipse cx="-95" cy="-40" rx="22" ry="13" transform="rotate(-20 -95 -40)"/>
      <ellipse cx="95" cy="-45" rx="18" ry="11" transform="rotate(25 95 -45)"/>
      <ellipse cx="-70" cy="80" rx="16" ry="10" transform="rotate(-35 -70 80)"/>
      <ellipse cx="75" cy="85" rx="20" ry="12" transform="rotate(30 75 85)"/>
      <ellipse cx="-140" cy="10" rx="14" ry="9"/>
      <ellipse cx="140" cy="5" rx="15" ry="10"/>
      <ellipse cx="0" cy="-130" rx="12" ry="8"/>
      <ellipse cx="0" cy="135" rx="13" ry="9"/>
    </g>

    <!-- 飞散方向箭头 -->
    <g stroke="#ffd94d" stroke-width="2.5" fill="none" stroke-linecap="round">
      <line x1="-60" y1="-30" x2="-110" y2="-55"/>
      <line x1="60" y1="-35" x2="115" y2="-60"/>
      <line x1="-45" y1="70" x2="-90" y2="105"/>
      <line x1="50" y1="75" x2="100" y2="110"/>
    </g>

    <!-- 中心标注 -->
    <text x="0" y="-160" text-anchor="middle" font-size="18" font-weight="700" fill="#fff3d6">初始奇点</text>
    <text x="0" y="195" text-anchor="middle" font-size="14" fill="#c9b98a">物质与能量向四面八方高速扩散</text>
  </g>

  <!-- ===================== 右侧：宇宙演化时间线 ===================== -->
  <g transform="translate(720,150)">
    <!-- 竖直时间轴 -->
    <line x1="30" y1="20" x2="30" y2="640" stroke="#ff9e4a" stroke-width="3"/>
    <!-- 时间轴箭头 -->
    <polygon points="30,785 22,765 38,765" fill="#ff9e4a"/>

    <!-- 阶段1：大爆炸瞬间 -->
    <circle cx="30" cy="60" r="10" fill="#ffd94d"/>
    <text x="55" y="62" font-size="17" font-weight="700" fill="#ffffff">t = 0</text>
    <text x="55" y="86" font-size="13" fill="#a8b8e0">宇宙诞生于一个无限密集、高温的奇点，空间、时间由此开始。</text>

    <!-- 阶段2：极早期 -->
    <circle cx="30" cy="190" r="10" fill="#ff8c3a"/>
    <text x="55" y="192" font-size="17" font-weight="700" fill="#ffffff">极早期</text>
    <text x="55" y="216" font-size="13" fill="#a8b8e0">宇宙以光速级速度膨胀，冷却后形成基本粒子与原子核。</text>

    <!-- 阶段3：星系形成 -->
    <circle cx="30" cy="320" r="10" fill="#ff6b2a"/>
    <text x="55" y="322" font-size="17" font-weight="700" fill="#ffffff">约 10 亿年</text>
    <text x="55" y="346" font-size="13" fill="#a8b8e0">引力使气体聚集，形成第一批恒星与星系。</text>

    <!-- 阶段4：今天 -->
    <circle cx="30" cy="450" r="12" fill="#fff7e6"/>
    <text x="55" y="452" font-size="17" font-weight="800" fill="#ffffff">约 138 亿年</text>
    <text x="55" y="476" font-size="13" fill="#a8b8e0">形成今天的宇宙，仍在持续膨胀。</text>

    <!-- 阶段5：未来 -->
    <circle cx="30" cy="580" r="10" fill="#ff9e4a"/>
    <text x="55" y="582" font-size="17" font-weight="700" fill="#ffffff">遥远未来</text>
    <text x="55" y="606" font-size="13" fill="#a8b8e0">膨胀继续，星系彼此远离。</text>

    <!-- 时间轴底部标签 -->
    <text x="30" y="820" text-anchor="middle" font-size="14" fill="#c9b98a">→ 时间的方向</text>
  </g>

  <!-- ===================== 底部：关键证据卡片 ===================== -->
  <g transform="translate(60,735)">
    <!-- 卡片背景 -->
    <rect width="1080" height="140" rx="16" fill="url(#cardGrad)" stroke="#ff9e4a" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="30" y="42" font-size="20" font-weight="800" fill="#ffd94d">关键证据</text>

    <!-- 证据1 -->
    <g transform="translate(60,70)">
      <circle cx="0" cy="-5" r="14" fill="#ff8c3a"/>
      <text x="28" y="0" font-size="15" font-weight="700" fill="#ffffff">宇宙微波背景辐射</text>
      <text x="28" y="24" font-size="12.5" fill="#a8b8e0">大爆炸留下的余温，均匀充满整个宇宙。</text>
    </g>
    <!-- 证据2 -->
    <g transform="translate(430,70)">
      <circle cx="0" cy="-5" r="14" fill="#ff6b2a"/>
      <text x="28" y="0" font-size="15" font-weight="700" fill="#ffffff">星系红移</text>
      <text x="28" y="24" font-size="12.5" fill="#a8b8e0">远处星系光谱向红端移动，证明宇宙在膨胀。</text>
    </g>
    <!-- 证据3 -->
    <g transform="translate(800,70)">
      <circle cx="0" cy="-5" r="14" fill="#ffd94d"/>
      <text x="28" y="0" font-size="15" font-weight="700" fill="#ffffff">宇宙化学丰度</text>
      <text x="28" y="24" font-size="12.5" fill="#a8b8e0">氢、氦比例与理论预测一致，印证早期条件。</text>
    </g>
  </g>

  <!-- 底部脚注 -->
  <text x="600" y="900" text-anchor="middle" font-size="12" fill="#5a6a9e">基于广义相对论与观测证据 · 宇宙仍在膨胀中</text>
</svg>
