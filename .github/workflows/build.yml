name: build image

# Builds the CUDA image and pushes it to GHCR.
#
# The version is read from .devops/VERSION, which also names the release the
# Dockerfile installs — so the image and the tarball it contains can never drift
# apart without this file changing.
#
# Tag scheme, following the sibling llama.cpp image repos:
#
#   server-dev-<version>-<YYYYMMDD-HHMM>   immutable candidate
#   server-dev                             floating, moved by this workflow
#   stable                                 floating, moved only by promote.yml
#
# `version` is "b<upstream tag>-<our revision>", e.g. b11158-1: the llama.cpp
# build tag is the version identity, not an invented semver.

on:
  push:
    branches: [main]
    paths:
      - '.devops/**'
      - 'docker-compose.yml'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      channel:
        description: 'channel to push (dev)'
        default: 'dev'
        type: choice
        options: [dev]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}/llama-bonsai2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        run: |
          set -euo pipefail
          v="$(tr -d '[:space:]' < .devops/VERSION)"
          [ -n "$v" ] || { echo "::error::.devops/VERSION is empty"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "stamp=$(date -u +%Y%m%d-%H%M)" >> "$GITHUB_OUTPUT"
          echo "building $v"

      # Confirm the release the Dockerfile pins actually exists and carries the
      # SHA-256 the Dockerfile expects.  A typo here would otherwise surface only
      # as a failed build after the 318 MB download.
      - name: Check the pinned release and digest
        env:
          V: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          file="bonsai2-cuda-universal-${V}.tar.gz"
          want="$(grep -oE 'TARBALL_SHA256=[0-9a-f]{64}' .devops/cuda.Dockerfile | head -1 | cut -d= -f2)"
          got="$(curl -fsSL "https://github.com/snailium/bonsai2-mainline/releases/download/${V}/${file}.sha256" | awk '{print $1}')"
          echo "Dockerfile: $want"
          echo "release   : $got"
          [ "$want" = "$got" ] || { echo "::error::SHA-256 in the Dockerfile does not match the release"; exit 1; }

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devops/cuda.Dockerfile
          push: true
          build-args: |
            BONSAI2_VERSION=${{ steps.ver.outputs.version }}
          tags: |
            ${{ env.IMAGE }}:server-dev-${{ steps.ver.outputs.version }}-${{ steps.ver.outputs.stamp }}
            ${{ env.IMAGE }}:server-dev

      - name: Summary
        run: |
          {
            echo "### image built"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| version | \`${{ steps.ver.outputs.version }}\` |"
            echo "| tags | \`server-dev-${{ steps.ver.outputs.version }}-${{ steps.ver.outputs.stamp }}\`, \`server-dev\` |"
          } >> "$GITHUB_STEP_SUMMARY"
