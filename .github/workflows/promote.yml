name: promote image

# Moves a floating tag onto an already-built image.  Manifest-only: `buildx
# imagetools create` copies the index and does not re-upload layers, so this
# takes seconds and cannot rebuild anything by accident.  Promote by digest
# rather than by a mutable tag.
#
# Requires a token with write:packages.  GITHUB_TOKEN works from this workflow;
# locally, use the PAT described in .devops/promote-image.sh.

on:
  workflow_dispatch:
    inputs:
      source:
        description: 'source tag or digest to promote from (e.g. server-dev-b11158-1-20260924-1912)'
        required: true
      target:
        description: 'target tag (e.g. stable, or a clean release tag)'
        required: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}/llama-bonsai2

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve source to a digest
        id: src
        env:
          SRC: ${{ inputs.source }}
        run: |
          set -euo pipefail
          if printf '%s' "$SRC" | grep -q '^sha256:'; then
            ref="${IMAGE}@${SRC}"
          else
            ref="${IMAGE}:${SRC}"
          fi
          d="$(docker buildx imagetools inspect "$ref" | awk '/^Digest:/{print $2; exit}')"
          [ -n "$d" ] || { echo "::error::could not resolve $ref"; exit 1; }
          echo "ref=$ref"     >> "$GITHUB_OUTPUT"
          echo "digest=$d"    >> "$GITHUB_OUTPUT"
          echo "resolved $ref -> $d"

      - name: Retag
        env:
          SRC: ${{ steps.src.outputs.ref }}
          DIGEST: ${{ steps.src.outputs.digest }}
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          docker buildx imagetools create --tag "${IMAGE}:${TARGET}" "${IMAGE}@${DIGEST}"
          echo "promoted ${DIGEST} -> ${IMAGE}:${TARGET}"

      - name: Verify both tags resolve to the same digest
        env:
          DIGEST: ${{ steps.src.outputs.digest }}
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          d="$(docker buildx imagetools inspect "${IMAGE}:${TARGET}" | awk '/^Digest:/{print $2; exit}')"
          echo "target digest: $d"
          [ "$d" = "$DIGEST" ] || { echo "::error::target digest differs from source"; exit 1; }
