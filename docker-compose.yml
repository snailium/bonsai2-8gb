# Ternary Bonsai 2 27B on CUDA — one image, one service per VRAM class.
#
#   docker compose up bonsai2-8gb        # the configuration we validate and ship
#
# ---------------------------------------------------------------------------
# CONFIGURATION IS DELIVERED AS LLAMA_ARG_* ENVIRONMENT VARIABLES, NOT FLAGS.
#
# llama.cpp maps every server argument to an LLAMA_ARG_* variable, so the whole
# configuration lives in `environment:` and no service passes any argv.  Watch the
# spelling: an unknown LLAMA_ARG_* is silently ignored, with no warning and no
# error, and the server falls back to its own default.
#
#   | what                                  | variable                     |
#   |---------------------------------------|------------------------------|
#   | model / bias paths                    | set by the entrypoint        |
#   | context                               | LLAMA_ARG_CTX_SIZE           |
#   | KV quantization                       | LLAMA_ARG_CACHE_TYPE_K/V     |
#   | speculative decoding                  | LLAMA_ARG_SPEC_TYPE,         |
#   |                                       | LLAMA_ARG_SPEC_DRAFT_N_MAX   |
#   | thinking budget                       | LLAMA_ARG_THINK_BUDGET       |
#   | sampling                              | LLAMA_ARG_TEMPERATURE,       |
#   |                                       | LLAMA_ARG_TOP_K, _TOP_P,     |
#   |                                       | _MIN_P, _PRESENCE_PENALTY... |
# ---------------------------------------------------------------------------
#
# MEMORY: WHY 40960 IS THE NUMBER FOR AN 8 GB CARD
#
# Measured on an RTX 5060 8 GB (8151 MiB reported, 447 MiB driver-reserved, so
# 7704 MiB usable): the shipped 8 GB service loads at 7508 MiB with MTP enabled,
# leaving about 198 MiB.  That is the headroom, and it is why the card must be
# otherwise idle — a desktop session or a browser holding the GPU will push the
# allocation over and the server will exit with
# "cudaMalloc failed: out of memory" while "initializing the context".
#
# Without MTP the picture changes (larger contexts load) but output quality
# collapses, so MTP stays on.  Do not "free up memory" by turning it off.
#
# THE FIRST RUN DOWNLOADS THE WEIGHTS
#
# The 5.85 GiB GGUF is not in the image; it lands on the mounted volume, once.
# The image also carries the calibrated `kv-mean-center.gguf` bias, which the
# entrypoint installs next to the weights.  Both survive restarts.  To pre-seed
# the volume instead, put the model and its `kv-mean-center.gguf` there yourself.
#
# BASE IMAGE / DRIVER
#
# ubuntu:26.04 because the binaries require glibc >= 2.43 (24.04 has 2.39 and
# cannot run them).  The container needs the host NVIDIA driver only, via
# nvidia-container-toolkit; the CUDA toolkit is neither installed nor needed.
# The binaries are compiled with CUDA 13.1 but link the CUDA 12 runtime ABI,
# which is what the base image's packages provide.

services:
  bonsai2-8gb:
    image: ghcr.io/snailium/bonsai2-8gb/llama-bonsai2:${BONSAI2_TAG:-stable}
    container_name: bonsai2-8gb
    restart: unless-stopped
    # Anything the entrypoint creates — the downloaded GGUF, the computed bias —
    # lands in the bind-mounted directory owned by whatever uid this runs as, and
    # the default is root, which would leave root-owned files in your home
    # directory.  Set BONSAI2_UID/BONSAI2_GID in .env to your own ids.  Everything
    # the server reads is world-readable, so a non-root uid works.
    user: "${BONSAI2_UID:-0}:${BONSAI2_GID:-0}"
    ports:
      - "18199:18199"
    volumes:
      # Bind mount, not a named volume.  Image updates never touch either kind, so
      # persistence across `docker compose pull && up` is not the reason.  The
      # reason is sharing: a named volume is opaque and cannot be reused, so
      # anyone who also runs scripts/serve.sh from the tarball would end up with a
      # SECOND copy of the 5.85 GiB GGUF and its own calibration bias.
      #
      # Point BONSAI2_MODELS_DIR at the directory you already use (see
      # .env.example); it defaults to ./models next to this file.  The directory
      # must be writable: on the first start the entrypoint downloads the weights
      # and calibrates the bias there if they are missing, and never again.
      - ${BONSAI2_MODELS_DIR:-./models}:/models
    environment:
      # --- the 8 GB profile (validated: pp512 710, tg128 54.2) -------------
      LLAMA_ARG_CTX_SIZE: "40960"
      LLAMA_ARG_CACHE_TYPE_K: "q4_0"      # --kv-mean-center requires q4_0
      LLAMA_ARG_CACHE_TYPE_V: "q4_0"
      LLAMA_ARG_FLASH_ATTN: "on"
      LLAMA_ARG_N_GPU_LAYERS: "99"
      LLAMA_ARG_N_PARALLEL: "1"
      LLAMA_ARG_SPEC_TYPE: "draft-mtp"
      # Must stay 1 at this context. Measured: with 2, the server loads
      # (7646 MiB) and then aborts on the first request with
      # "CUDA error: the resource allocation failed" - K=2 needs ~150 MiB more and
      # 40960 already uses 7496 of 7704 usable MiB. It reports healthy before it
      # dies, and restart: unless-stopped hides the crash. K=2 only fits at a
      # smaller context (32768 leaves ~1.4 GiB spare) and buys +4-8% decode there.
      LLAMA_ARG_SPEC_DRAFT_N_MAX: "1"
      # agent/tool work wants a bounded, low-effort thinker; the template
      # default ("xhigh") is actively harmful on this model
      LLAMA_ARG_REASONING_EFFORT: "low"
      LLAMA_ARG_THINK_BUDGET: "4096"
      LLAMA_ARG_TEMPERATURE: "0.7"
      LLAMA_ARG_TOP_K: "20"
      LLAMA_ARG_TOP_P: "0.80"
      LLAMA_ARG_MIN_P: "0.0"
      LLAMA_ARG_PRESENCE_PENALTY: "1.5"
      LLAMA_ARG_FREQUENCY_PENALTY: "0.0"
      LLAMA_ARG_REPEAT_PENALTY: "1.0"
      # Paths INSIDE the container.  Only set these if your model file is not
      # named Ternary-Bonsai-2-27B-PTQ1_0-mtp-lean.gguf — otherwise the entrypoint
      # will not recognise it and will download a second 6.3 GB copy under the
      # default name.  Setting BONSAI2_MODEL to a *host* path will not work: it is
      # resolved inside the container, where the directory is mounted at /models.
      BONSAI2_MODEL: "${BONSAI2_MODEL:-/models/Ternary-Bonsai-2-27B-PTQ1_0-mtp-lean.gguf}"
      BONSAI2_KV_BIAS: "${BONSAI2_KV_BIAS:-/models/kv-mean-center.gguf}"
      # set to 0 to require the weights to be mounted rather than downloaded
      BONSAI2_AUTODOWNLOAD: "1"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ---------------------------------------------------------------------
  # A larger-memory example.  NOT validated by us — nobody has run this
  # configuration on the hardware it targets.  It is here to show which knob
  # changes, not as a recommendation.  Raise CTX only as far as the card allows
  # and re-check with `nvidia-smi` during load.
  bonsai2-bigvram:
    image: ghcr.io/snailium/bonsai2-8gb/llama-bonsai2:${BONSAI2_TAG:-stable}
    container_name: bonsai2-bigvram
    restart: unless-stopped
    user: "${BONSAI2_UID:-0}:${BONSAI2_GID:-0}"
    profiles: ["bigvram"]              # `docker compose --profile bigvram up`
    ports:
      - "18200:18199"
    volumes:
      - ${BONSAI2_MODELS_DIR:-./models}:/models
    environment:
      LLAMA_ARG_PORT: "18199"
      LLAMA_ARG_CTX_SIZE: "131072"     # 128K — unverified
      LLAMA_ARG_CACHE_TYPE_K: "q8_0"   # q4_0 keeps --kv-mean-center usable; q8_0
      LLAMA_ARG_CACHE_TYPE_V: "q8_0"   # is a larger cache and drops that flag
      LLAMA_ARG_FLASH_ATTN: "on"
      LLAMA_ARG_N_GPU_LAYERS: "99"
      LLAMA_ARG_N_PARALLEL: "1"
      LLAMA_ARG_SPEC_TYPE: "draft-mtp"
      LLAMA_ARG_SPEC_DRAFT_N_MAX: "1"
      LLAMA_ARG_REASONING_EFFORT: "low"
      LLAMA_ARG_THINK_BUDGET: "4096"
      BONSAI2_AUTODOWNLOAD: "1"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
